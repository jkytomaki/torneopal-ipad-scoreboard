<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- iOS specific meta tags for full screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scoreboard">
</head>
<body>
    <div id="app">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Load Match</h1>
            <div class="input-container">
                <div class="input-group">
                    <label for="hostname-input">Tournament Hostname:</label>
                    <input type="text" id="hostname-input" placeholder="e.g., torneopal.example.com" autocapitalize="none">
                </div>
                <div class="input-group">
                    <label for="match-id-input">Match ID:</label>
                    <input type="number" id="match-id-input" placeholder="e.g., 12345" inputmode="numeric" pattern="[0-9]*">
                </div>
            </div>
            <button id="load-match-button" disabled>Load Match</button>
            <p id="start-error" class="error-message"></p>
            <button id="reload-button-start" class="reload-button">🔄 Reload</button>
            <div id="version-display"></div>
        </div>

        <!-- Scoreboard Screen -->
        <div id="scoreboard-screen" class="screen">
            <div class="scoreboard-container">
                <div id="team-a" class="team-panel">
                    <div class="score" id="score-a">0</div>
                    <div class="team-name" id="team-name-a">Team A</div>
                </div>
                <div id="team-b" class="team-panel">
                    <div class="score" id="score-b">0</div>
                    <div class="team-name" id="team-name-b">Team B</div>
                </div>
            </div>
            <p id="score-error" class="error-message"></p>
            <div class="controls-bottom-left">
                <button id="decrease-font-button" class="font-adjust-button">-</button>
                <button id="increase-font-button" class="font-adjust-button">+</button>
            </div>
            <div class="controls-bottom-right">
                 <button id="reload-button-score" class="reload-button">🔄 Reload</button>
                 <button id="reset-button">↺ Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
